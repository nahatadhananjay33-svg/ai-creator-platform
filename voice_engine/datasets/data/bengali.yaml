language: bn
version: "1.0"
description: >
  Bengali (Bengali script) benchmark prompts for real-estate voice AI and
  content narration. Mirrors the English/Hindi corpora so per-language
  scores are directly comparable.

items:
  - id: bn-prop-001
    category: property_discussion
    text: >
      এই তিন বিএইচকে ফ্ল্যাটটি সাত তলায়, কার্পেট এরিয়া চোদ্দোশো পঞ্চাশ
      বর্গফুট। সঙ্গে দুটি কভার্ড পার্কিং এবং মডিউলার কিচেন রয়েছে। টাওয়ারটি
      পূর্বমুখী, তাই বসার ঘরে সকালের রোদ খুব ভালো আসে।
    expected_scripts: [Bengali]

  - id: bn-prop-002
    category: property_discussion
    text: >
      সোসাইটিতে ক্লাবহাউস, সুইমিং পুল, জিম আর প্রায় ষাট শতাংশ খোলা সবুজ
      জায়গা আছে। রক্ষণাবেক্ষণ খরচ প্রতি বর্গফুটে মাসে সাড়ে তিন টাকা।
    expected_scripts: [Bengali]

  - id: bn-builder-001
    category: builder_name
    text: >
      প্রকল্পটি তৈরি করছে অবিনাশ গ্রুপ, রায়পুরের অন্যতম বিশ্বস্ত নির্মাতা।
      আগের পর্যায়ে শ্রী বালাজি কনস্ট্রাকশনস এবং ঢিলোঁ বিল্ডকন তাদের
      অংশীদার ছিল।
    expected_scripts: [Bengali]

  - id: bn-project-001
    category: project_name
    text: >
      অবিনাশ ক্যাপিটাল হোমস টু পুরনো ধামতারি রোডে অবস্থিত, আর ওয়ালফোর্ট
      এলিগান্তে ও সিঙ্গাপুর সিটি নবা রায়পুরের এয়ারপোর্ট করিডরের কাছে।
    expected_scripts: [Bengali]

  - id: bn-rera-001
    category: rera_number
    text: >
      প্রকল্পটি ছত্তিশগড় রেরা-তে নিবন্ধিত। নিবন্ধন নম্বরটি হল পি সি জি
      আর ই আর এ দুই পাঁচ শূন্য পাঁচ এক আট শূন্য শূন্য শূন্য পাঁচ চার দুই।
      আপনি রেরা পোর্টালে এটি যাচাই করতে পারেন।
    expected_scripts: [Bengali]

  - id: bn-site-001
    category: site_visit
    text: >
      আমি আপনার জন্য এই শনিবার সকাল সাড়ে এগারোটায় সাইট ভিজিটের ব্যবস্থা
      করতে পারি। আমাদের প্রতিনিধি রিং রোড নম্বর এক-এর প্রকল্প গেটে আপনার
      সঙ্গে দেখা করবেন, পুরো ভিজিটে মোটামুটি পঁয়তাল্লিশ মিনিট লাগবে।
    expected_scripts: [Bengali]

  - id: bn-appt-001
    category: appointment
    text: >
      আপনার অ্যাপয়েন্টমেন্ট মঙ্গলবার, চোদ্দোই জুলাই বিকেল চারটায় আমাদের
      তেলিবান্ধা অফিসে নিশ্চিত হয়েছে। বুকিংয়ের জন্য দয়া করে আধার কার্ড
      এবং প্যান কার্ডের একটি কপি সঙ্গে আনবেন।
    expected_scripts: [Bengali]

  - id: bn-addr-001
    category: address
    text: >
      স্যাম্পল ফ্ল্যাটের ঠিকানা হল প্লট নম্বর বারো বি, সেক্টর সাতাশ, নবা
      রায়পুর অটল নগর, সেন্ট্রাল পার্কের প্রবেশদ্বারের উল্টোদিকে, পিন কোড
      চার নয় দুই শূন্য শূন্য দুই।
    expected_scripts: [Bengali]

  - id: bn-phone-001
    category: phone_number
    text: >
      আমাদের সেলস টিমের সঙ্গে যোগাযোগ করুন নয় আট দুই ছয় শূন্য এক চার তিন
      পাঁচ সাত নম্বরে, অথবা সকাল দশটা থেকে সন্ধ্যা সাতটার মধ্যে ল্যান্ডলাইন
      শূন্য সাত সাত এক, দুই চার চার, এক শূন্য এক শূন্যে ফোন করুন।
    expected_scripts: [Bengali]

  - id: bn-price-001
    category: pricing
    text: >
      দুই বিএইচকে-র দাম শুরু বিয়াল্লিশ লক্ষ নব্বই হাজার টাকা থেকে, আর তিন
      বিএইচকে প্রিমিয়াম ইউনিটের দাম এক কোটি পাঁচ লক্ষ পর্যন্ত। এর মধ্যে
      জিএসটি, রেজিস্ট্রি এবং একটি কভার্ড কার পার্কিং ধরা আছে।
    expected_scripts: [Bengali]

  - id: bn-loan-001
    category: loan
    text: >
      কুড়ি শতাংশ ডাউন পেমেন্টের পর, পঞ্চাশ লক্ষ টাকার হোম লোনে সাড়ে আট
      শতাংশ সুদে কুড়ি বছরের ইএমআই হবে মাসে প্রায় তেতাল্লিশ হাজার চারশো
      টাকা। এসবিআই, এইচডিএফসি এবং এলআইসি হাউজিং ফাইন্যান্সের সঙ্গে আমাদের
      সরাসরি চুক্তি আছে।
    expected_scripts: [Bengali]

  - id: bn-narr-001
    category: long_narration
    text: >
      নমস্কার, স্বাগত জানাই ক্যাপিটাল গ্রিনস-এর এই সম্পূর্ণ ওয়াকথ্রুতে —
      রায়পুরের সবচেয়ে নতুন ইন্টিগ্রেটেড টাউনশিপ। বিধানসভা রোডের ওপর
      বত্রিশ একর জুড়ে এই টাউনশিপে আছে আবাসিক টাওয়ার, হাই স্ট্রিট রিটেল
      জোন এবং প্রবীণদের জন্য আলাদা ব্লক। প্রধান প্রবেশপথ দিয়ে ঢুকলেই
      দেখবেন সত্তর ফুট চওড়া অভ্যন্তরীণ রাস্তা, দুপাশে ফুলের গাছের সারি।
      প্রথম তিনটি টাওয়ার — অ্যাম্বার, কোরাল আর জেড — এ আছে দুই ও তিন
      বিএইচকে-র ফ্ল্যাট, এক হাজার পঞ্চাশ থেকে আঠারোশো পঞ্চাশ বর্গফুট
      পর্যন্ত। প্রতিটি ফ্ল্যাট বাস্তু মেনে তৈরি, কোনও দেওয়াল ভাগ করা নয়,
      আর প্রতিটি ঘরে আলো-বাতাসের পুরো ব্যবস্থা আছে। টাউনশিপে আরও আছে দুই
      একরের সেন্ট্রাল পার্ক, অ্যাম্ফিথিয়েটার এবং ফুটবল টার্ফ। প্রথম
      পর্যায়ের পজেশন দু হাজার সাতাশের ডিসেম্বরে নির্ধারিত, এবং প্রকল্পটি
      সমস্ত সরকারি অনুমোদন পেয়ে গেছে।
    expected_scripts: [Bengali]
    notes: ~950 characters; Bengali long-form narration stability probe.

  - id: bn-conv-001
    category: conversation
    text: >
      নমস্কার! শর্মা বাবুর সঙ্গে কথা বলছি তো? বাহ্, খুব ভালো। আমি স্কাইলাইন
      রিয়েলটি থেকে বলছি, আপনি গতকাল ভিলা প্লট নিয়ে খোঁজ নিয়েছিলেন। দুই
      মিনিট সময় হবে? আচ্ছা, আপনি যে প্লটটি পছন্দ করেছেন সেটি কোণার প্লট,
      তিরিশ বাই পঞ্চাশ ফুট, পার্কের মুখোমুখি। আপনি কি এই সপ্তাহান্তে সাইট
      ভিজিট করতে চান, নাকি আগে লেআউট আর দাম হোয়াটসঅ্যাপে পাঠিয়ে দেব?
    expected_scripts: [Bengali]

  - id: bn-conv-002
    category: conversation
    text: >
      পজেশন দেরি নিয়ে আপনার উদ্বেগ আমি পুরোপুরি বুঝি। একটু পরিষ্কার করে
      বলি — আগের পর্যায়টি নতুন এয়ারপোর্ট রোডের কারণে দেরি হয়েছিল, কিন্তু
      এই পর্যায়ের কমপ্লিশন সার্টিফিকেটের আবেদন আগেই জমা পড়ে গেছে। চাইলে
      আমি এখনই রেরার ত্রৈমাসিক অগ্রগতি রিপোর্ট আপনাকে ইমেল করে দিচ্ছি।
      ঠিক আছে?
    expected_scripts: [Bengali]

  - id: bn-code-001
    category: code_switching
    text: >
      বুকিং অ্যামাউন্ট মাত্র একান্ন হাজার টাকা স্যার। Documentation আর loan
      approval-এর পুরো process আমাদের team handle করবে, আপনাকে শুধু
      application form-এ sign করতে হবে।
    expected_scripts: [Bengali, Latin]
    notes: Benglish — Bengali-dominant with embedded English; common in Kolkata sales calls.
