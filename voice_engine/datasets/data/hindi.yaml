language: hi
version: "1.0"
description: >
  Hindi (Devanagari) benchmark prompts. Stresses pure-Hindi real-estate
  vocabulary, Indian numerals read-outs, RERA and phone sequences, long
  narration, and natural conversational register.

items:
  - id: hi-prop-001
    category: property_discussion
    text: >
      यह तीन बीएचके फ्लैट सातवीं मंज़िल पर है, जिसका कारपेट एरिया चौदह सौ
      पचास वर्ग फुट है। इसमें दो कवर्ड पार्किंग और मॉड्यूलर किचन शामिल है।
      टावर पूर्वमुखी है, इसलिए बैठक में सुबह की धूप अच्छी आती है।
    expected_scripts: [Devanagari]

  - id: hi-prop-002
    category: property_discussion
    text: >
      सोसाइटी में क्लबहाउस, स्विमिंग पूल, जिम और लगभग साठ प्रतिशत खुला
      हरित क्षेत्र है। मेंटेनेंस साढ़े तीन रुपये प्रति वर्ग फुट प्रति माह है।
    expected_scripts: [Devanagari]

  - id: hi-builder-001
    category: builder_name
    text: >
      यह प्रोजेक्ट अविनाश ग्रुप द्वारा विकसित किया जा रहा है, जो रायपुर के
      सबसे भरोसेमंद बिल्डरों में से एक है। पिछले चरणों में श्री बालाजी
      कंस्ट्रक्शन्स और ढिल्लन बिल्डकॉन उनके साझेदार रहे हैं।
    expected_scripts: [Devanagari]

  - id: hi-project-001
    category: project_name
    text: >
      अविनाश कैपिटल होम्स टू पुराने धमतरी रोड पर स्थित है, जबकि वॉलफोर्ट
      एलिगांते और सिंगापुर सिटी नवा रायपुर के एयरपोर्ट कॉरिडोर के पास हैं।
    expected_scripts: [Devanagari]
    notes: English project names embedded in Devanagari text — transliteration probe.

  - id: hi-rera-001
    category: rera_number
    text: >
      यह प्रोजेक्ट छत्तीसगढ़ रेरा में पंजीकृत है। पंजीकरण संख्या है पी सी
      जी आर ई आर ए दो पाँच शून्य पाँच एक आठ शून्य शून्य शून्य पाँच चार दो।
      आप इसे रेरा पोर्टल पर सत्यापित कर सकते हैं।
    expected_scripts: [Devanagari]
    notes: Alphanumeric sequence spelled in Hindi.

  - id: hi-site-001
    category: site_visit
    text: >
      मैं आपके लिए इस शनिवार सुबह साढ़े ग्यारह बजे साइट विज़िट की व्यवस्था
      कर सकती हूँ। हमारे प्रतिनिधि रिंग रोड नंबर एक पर प्रोजेक्ट गेट पर
      आपसे मिलेंगे, और विज़िट में लगभग पैंतालीस मिनट लगेंगे।
    expected_scripts: [Devanagari]

  - id: hi-appt-001
    category: appointment
    text: >
      आपकी अपॉइंटमेंट मंगलवार, चौदह जुलाई को शाम चार बजे हमारे तेलीबांधा
      कार्यालय में पक्की हो गई है। कृपया बुकिंग के लिए अपना आधार कार्ड और
      पैन कार्ड की एक प्रति साथ लाएँ।
    expected_scripts: [Devanagari]

  - id: hi-addr-001
    category: address
    text: >
      सैंपल फ्लैट का पता है प्लॉट नंबर बारह बी, सेक्टर सत्ताईस, नवा रायपुर
      अटल नगर, सेंट्रल पार्क के प्रवेश द्वार के सामने, छत्तीसगढ़, पिन कोड
      चार नौ दो शून्य शून्य दो।
    expected_scripts: [Devanagari]

  - id: hi-phone-001
    category: phone_number
    text: >
      आप हमारी सेल्स टीम से नौ आठ दो छह शून्य एक चार तीन पाँच सात पर संपर्क
      कर सकते हैं, या सुबह दस से शाम सात बजे के बीच लैंडलाइन शून्य सात सात
      एक, दो चार चार, एक शून्य एक शून्य पर बात कर सकते हैं।
    expected_scripts: [Devanagari]

  - id: hi-price-001
    category: pricing
    text: >
      दो बीएचके की कीमत बयालीस लाख नब्बे हज़ार रुपये से शुरू होती है, और
      तीन बीएचके प्रीमियम यूनिट एक करोड़ पाँच लाख तक जाती हैं। इसमें
      जीएसटी, रजिस्ट्री और एक कवर्ड कार पार्किंग शामिल है।
    expected_scripts: [Devanagari]

  - id: hi-loan-001
    category: loan
    text: >
      बीस प्रतिशत डाउन पेमेंट के साथ, पचास लाख के होम लोन पर साढ़े आठ
      प्रतिशत ब्याज दर से बीस साल की ईएमआई लगभग तैंतालीस हज़ार चार सौ रुपये
      प्रति माह आएगी। हमारी एसबीआई, एचडीएफसी और एलआईसी हाउसिंग फाइनेंस से
      टाई-अप है।
    expected_scripts: [Devanagari]

  - id: hi-narr-001
    category: long_narration
    text: >
      नमस्कार, और स्वागत है कैपिटल ग्रीन्स के इस संपूर्ण वॉकथ्रू में, जो
      रायपुर की सबसे नई इंटीग्रेटेड टाउनशिप है। विधानसभा रोड पर बत्तीस एकड़
      में फैली इस टाउनशिप में आवासीय टावर, हाई स्ट्रीट रिटेल ज़ोन और
      वरिष्ठ नागरिकों के लिए अलग ब्लॉक है। भव्य प्रवेश द्वार से अंदर आते ही
      आपको सत्तर फुट चौड़ी आंतरिक सड़कें दिखेंगी, जिनके किनारे फूलों के
      पेड़ लगे हैं। पहले तीन टावर, एम्बर, कोरल और जेड, में दो और तीन बीएचके
      के घर हैं, जिनका क्षेत्रफल एक हज़ार पचास से अठारह सौ पचास वर्ग फुट तक
      है। हर फ्लैट वास्तु के अनुसार बना है, किसी की दीवार साझा नहीं है, और
      हर कमरे में हवा और रोशनी का पूरा इंतज़ाम है। टाउनशिप में दो एकड़ का
      सेंट्रल पार्क, एम्फीथिएटर और फुटबॉल टर्फ भी है। पहले चरण का पज़ेशन
      दिसंबर दो हज़ार सत्ताईस में तय है, और प्रोजेक्ट को सभी वैधानिक
      स्वीकृतियाँ मिल चुकी हैं।
    expected_scripts: [Devanagari]
    notes: ~950 characters; long-form Hindi narration stability probe.

  - id: hi-conv-001
    category: conversation
    text: >
      नमस्ते! क्या मेरी बात शर्मा जी से हो रही है? बहुत अच्छा। मैं स्काईलाइन
      रियल्टी से बोल रही हूँ, आपने कल विला प्लॉट के बारे में पूछताछ की थी।
      क्या आपके पास दो मिनट हैं? जी, तो आपने जो प्लॉट पसंद किया है वह कोने
      वाला है, तीस बाय पचास फुट, पार्क के सामने। आप इस वीकेंड साइट विज़िट
      करना चाहेंगे, या पहले मैं आपको लेआउट और कीमत व्हाट्सएप पर भेज दूँ?
    expected_scripts: [Devanagari]

  - id: hi-conv-002
    category: conversation
    text: >
      पज़ेशन में देरी की आपकी चिंता मैं पूरी तरह समझती हूँ। मैं स्पष्ट कर
      दूँ — पिछला चरण नई एयरपोर्ट रोड के कारण विलंबित हुआ था, लेकिन इस चरण
      का कम्प्लीशन सर्टिफिकेट पहले ही आवेदन में है। आप चाहें तो मैं अभी
      रेरा की तिमाही प्रगति रिपोर्ट आपको ईमेल कर दूँ। ठीक रहेगा?
    expected_scripts: [Devanagari]

  - id: hi-code-001
    category: code_switching
    text: >
      बुकिंग अमाउंट सिर्फ इक्यावन हज़ार रुपये है सर। Documentation and loan
      approval की पूरी process हमारी टीम handle करेगी, आपको बस application
      form sign करना है।
    expected_scripts: [Devanagari, Latin]
    notes: Devanagari-dominant with embedded English words — script-mixing probe.
