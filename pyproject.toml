[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-creator-platform"
version = "0.1.0"
description = "AI Creator Platform - production content generation platform (voice, avatar, reels, voice AI)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Development / testing
dev = [
    "pytest>=8.0",
    "psutil>=5.9",
]
# Resource monitoring during benchmarks (recommended)
monitoring = ["psutil>=5.9"]
# Audio analysis metrics (objective evaluation)
audio = ["numpy>=1.26", "soundfile>=0.12", "librosa>=0.10"]
# Speaker-similarity metric backend
similarity = ["resemblyzer>=0.1.4"]
# ASR-based pronunciation / intelligibility metric backend
asr = ["faster-whisper>=1.0"]
# Video decoding + frame analysis for real codec outputs (avatar benchmark)
video = ["numpy>=1.26", "opencv-python>=4.9"]
# Face-identity metric backend (research-only InsightFace models; see
# avatar_engine/docs/BENCHMARKING.md before any production use)
face-id = ["insightface>=0.7", "onnxruntime>=1.17"]
# --- Voice model adapter extras (install per model, see voice_engine/docs/INSTALLATION.md) ---
f5-tts = ["f5-tts"]
xtts = ["coqui-tts>=0.24"]          # Idiap-maintained fork of Coqui TTS
openvoice = ["myshell-openvoice", "melo-tts"]
chatterbox = ["chatterbox-tts"]
dia = ["nari-tts"]
melotts = ["melo-tts"]

[tool.setuptools]
packages = { find = { include = [
    "foundation*",
    "voice_engine*",
    "avatar_engine*",
    "script_engine*",
    "caption_engine*",
    "branding_engine*",
    "asset_engine*",
    "scene_engine*",
    "music_engine*",
    "editing_engine*",
    "creator_studio*",
    "media_intelligence*",
    "workflow_engine*",
    "content_library*",
    "quality_engine*",
    "upload_engine*",
    "reel_engine*",
    "creator*",
    "batch_runner*",
    "export*",
    "production*",
] } }

[tool.pytest.ini_options]
testpaths = ["foundation/tests", "voice_engine/tests", "avatar_engine/tests", "caption_engine/tests", "scene_engine/tests", "music_engine/tests", "script_engine/tests", "editing_engine/tests", "creator_studio/tests", "media_intelligence/tests", "workflow_engine/tests", "content_library/tests", "quality_engine/tests", "upload_engine/tests", "creator/tests", "batch_runner/tests", "production/cloud_setup/tests"]
addopts = "-q"
markers = [
    "integration: end-to-end test exercising real engines (may need ffmpeg/models)",
]

[tool.mypy]
python_version = "3.10"
strict = true
